{% import "_ui.html" as ui %}
<!doctype html>
<html lang="en">
<head>
{{ ui.head("SFT STELLAR · Firmware") }}
<link rel="stylesheet" href="{{ url_for('static', filename='firmware.css') }}">
</head>
<body class="fw-page">
{{ ui.topbar("firmware", version) }}

<div class="fw-bar">
  <div class="fw-dev">
    <span class="chip" id="fw-device">ESP32</span>
    <span class="muted small" id="fw-info"></span>
  </div>
  <span class="grow"></span>
  <button id="fw-save">Save</button>
  <button id="fw-compile">Compile</button>
  <button id="fw-upload">Upload to ESP32</button>
  <button class="primary" id="fw-both">Compile and upload</button>
</div>

<main class="fw-main">
  <div class="editor">
    <div class="editor-h"><span id="fw-name">Sketch</span><span class="muted small">Ctrl+S saves</span></div>
    <textarea id="code" spellcheck="false" wrap="off" aria-label="ESP32 code"></textarea>
  </div>
  <section class="fw-side">
    <div class="fw-status">
      <div class="row"><b id="fw-job">Ready</b></div>
      <div class="bar"><div id="fw-progress"></div></div>
    </div>
    <div class="fw-log-wrap">
      <div class="editor-h"><span>Output</span></div>
      <pre id="fw-log"></pre>
    </div>
    <label class="fw-file"><span>Upload a ready .bin file instead</span><input type="file" id="fw-file" accept=".bin"></label>
  </section>
</main>

<script src="{{ url_for('static', filename='firmware.js') }}"></script>
</body>
</html>
