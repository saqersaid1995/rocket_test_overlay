name: Stellar Ops V2 CI

on:
  push:
    branches:
      - development/stellar-ops-v2
  pull_request:
    branches:
      - development/stellar-ops-v2
      - main

concurrency:
  group: stellar-ops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stellar-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STELLAR_OPS_ENV: DEVELOPMENT
      STELLAR_OPS_SECRET: ci-only-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Install Chromium for browser acceptance
        run: python -m playwright install --with-deps chromium
      - name: Compile application
        run: python -m compileall -q stellar_ops
      - name: Validate browser JavaScript syntax
        run: node --check stellar_ops/static/control.js && node --check stellar_ops/static/workspace.js
      - name: Browser smoke and accessibility acceptance
        run: |
          export STELLAR_OPS_DATA="$(mktemp -d)"
          PORT=5011 python -m stellar_ops.app >/tmp/stellar-ops-browser.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5011/health/live >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            sed -n '1,240p' /tmp/stellar-ops-browser.log
            exit 1
          fi
          RUN_BROWSER_E2E=1 STELLAR_OPS_BASE_URL=http://127.0.0.1:5011 BROWSER_ARTIFACT_DIR=/tmp/stellar-browser-artifacts python -m unittest stellar_ops.tests.test_browser_smoke -v
      - name: Run Stellar Ops tests
        run: python -m unittest discover -s stellar_ops/tests -p "test_*.py" -v
