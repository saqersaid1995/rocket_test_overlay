name: Stellar Ops V2 CI

on:
  push:
    branches:
      - development/stellar-ops-v2
  pull_request:
    branches:
      - development/stellar-ops-v2
      - main

permissions:
  contents: read

jobs:
  stellar-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STELLAR_OPS_ENV: DEVELOPMENT
      STELLAR_OPS_SECRET: ci-only-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q stellar_ops
      - name: Run Stellar Ops tests
        run: python -m unittest discover -s stellar_ops/tests -p "test_*.py" -v
