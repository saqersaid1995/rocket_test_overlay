# Test Stand Console — configuration
# Copy this file to config.yaml and edit it. config.yaml is not committed to Git.

web:
  host: 0.0.0.0
  port: 5050                 # open http://localhost:5050

telemetry:
  esp_ip: 192.168.1.50       # ESP32 Ethernet address (System check pings it)
  listen_port: 9100          # must match "Receiver TCP port" on the ESP32 page
  device_id: PT-01
  stale_after_s: 1.0         # no data for 1 s -> link shown as STALE / LOST

pressure:
  max_expected_bar: 100      # sensor range (0-100 bar transducer)
  alarm_bar: 80              # reading turns red above this

ignition:
  # simulation : no physical output (training, screen checks)
  # esp32      : real output through the ESP32 ignition module (ignition.ino)
  driver: simulation
  device_id: PT-01
  countdown_s: 10
  pulse_ms: 1000             # igniter on-time (max 3000, also capped in firmware)
  hold_to_start_s: 1.5       # START must be held this long
  arm_timeout_s: 120         # ARMED with no action -> back to SAFE
  require_telemetry: true    # cannot ARM, and auto-ABORT, without live pressure data
  relay_test_ms: 300         # RELAY TEST click length (one relay at a time, max 1000)

recorder:
  directory: data/sessions
  pre_trigger_s: 10          # keep 10 s of pressure from before recording starts
  auto_record: true          # countdown start -> recording starts automatically
  auto_stop_after_fire_s: 30

# IP cameras — easiest from the app: Settings → Cameras (scan, add, test).
# IP cameras (RTSP). Use the camera's low-resolution sub-stream for preview
# and the main stream for recording. Remove the list (cameras: []) for none.
cameras:
  - id: cam1
    name: STAND
    preview_url: rtsp://admin:password@192.168.1.60:554/stream2
    record_url:  rtsp://admin:password@192.168.1.60:554/stream1
    enabled: false           # set true after entering the real camera address
  - id: cam2
    name: WIDE
    url: rtsp://admin:password@192.168.1.61:554/stream1
    enabled: false           # set true when the camera is connected

thrust:                     # thrust estimated from chamber pressure (when no load cell is fitted)
  enabled: false
  propellant: KNSB          # KNSB, KNDX, KNSU, APCP or custom (then set gamma)
  gamma: 1.04               # ratio of specific heats, two-phase flow
  throat_mm: 0              # nozzle throat diameter
  exit_mm: 0                # nozzle exit diameter
  ambient_bar: 1.013        # air pressure at the stand
  efficiency: 0.95          # real-nozzle correction, 0.90-0.95
  propellant_g: 0           # propellant mass, for Isp (optional)

